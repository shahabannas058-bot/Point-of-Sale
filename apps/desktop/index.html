<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Mobile Shop POS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D4ED8'/%3E%3Crect x='10' y='6' width='12' height='20' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M14 22h4' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply stored theme / language before first paint (avoids a flash).
      try {
        var p = JSON.parse(localStorage.getItem('pos-prefs') || '{}').state || {};
        var d = document.documentElement;
        if (p.theme === 'light' || p.theme === 'dark') d.setAttribute('data-theme', p.theme);
        if (p.lang === 'ur') {
          d.lang = 'ur';
          d.dir = 'rtl';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
