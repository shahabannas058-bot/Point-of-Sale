<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>HS POS</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Apply stored theme / language before first paint (avoids a flash).
      try {
        var p = JSON.parse(localStorage.getItem('pos-prefs') || '{}').state || {};
        var d = document.documentElement;
        if (p.theme === 'light' || p.theme === 'dark') d.setAttribute('data-theme', p.theme);
        if (p.lang === 'ur') d.lang = 'ur-Latn'; // Roman Urdu: Latin letters, stays left-to-right
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
